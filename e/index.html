<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7c5cfc">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%237c5cfc%22%2F%3E%3Cpath%20d%3D%22M12%203C12.7%208%2013.6%209.3%2021%2012C13.6%2014.7%2012.7%2016%2012%2021C11.3%2016%2010.4%2014.7%203%2012C10.4%209.3%2011.3%208%2012%203Z%22%20fill%3D%22white%22%2F%3E%3C%2Fsvg%3E">
<title>Plan4U — invitation</title>
<style>
  :root{
    --ink:#111114; --ink-soft:#3a3a40; --paper:#ffffff; --surface:#f7f7f8; --surface-2:#f0f0f2;
    --secondary:#8a8a8e; --tertiary:#b9b9be; --hairline:#ececee;
    --lav:#7c5cfc; --lav-wash:#e7e0ff; --mint:#2fb56f; --mint-wash:#ddf3e4; --pink:#ff5a8a; --pink-wash:#ffe0ea;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
    --shadow:0 30px 70px -30px rgba(24,20,52,.28),0 10px 28px -16px rgba(24,20,52,.22);
    --accent:#4f8df7; --accent-wash:#dce8ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#f4f4f6; --ink-soft:#c9c9d0; --paper:#0e0e12; --surface:#1a1a20; --surface-2:#24242b;
      --secondary:#9a9aa3; --tertiary:#6a6a74; --hairline:#2a2a31; --lav-wash:#2a2450; --mint-wash:#173a27; --pink-wash:#4a1f2d; --accent-wash:#1e2f4f; }
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5}
  .wrap{max-width:560px; margin:0 auto; padding:28px 18px 60px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:650; font-size:15px; margin-bottom:26px}
  .brand svg{width:26px; height:26px}
  .card{background:var(--surface); border-radius:22px; padding:22px 22px 20px; box-shadow:var(--shadow); border:1px solid var(--hairline); overflow:hidden; position:relative}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--accent)}
  .kicker{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--secondary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px}
  h1{font-size:clamp(24px,5vw,30px); line-height:1.15; margin:0 0 14px; letter-spacing:-.01em; overflow-wrap:anywhere}
  .row{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--hairline); font-size:15.5px}
  .row .ic{flex:0 0 22px; color:var(--accent); margin-top:1px}
  .row .ic svg{width:20px; height:20px}
  .row .v{color:var(--ink-soft); overflow-wrap:anywhere; white-space:pre-wrap}
  .row .v b{color:var(--ink); font-weight:650}
  .going{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
  .chip{background:var(--mint-wash); color:var(--mint); font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px}
  .answer{margin-top:22px; padding-top:18px; border-top:1px solid var(--hairline)}
  .answer label{display:block; font-size:12.5px; font-weight:600; color:var(--secondary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px}
  .answer input{width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:14px; border:1px solid var(--hairline); background:var(--paper); color:var(--ink); outline:none}
  .answer input:focus{border-color:var(--lav)}
  .btns{display:flex; gap:10px; margin-top:12px}
  .btn{flex:1; font:inherit; font-size:15.5px; font-weight:650; padding:13px 14px; border-radius:14px; border:1px solid transparent; cursor:pointer; transition:transform .12s ease, opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.55; cursor:default}
  .btn-yes{background:var(--mint); color:#fff}
  .btn-no{background:var(--surface-2); color:var(--ink); border-color:var(--hairline)}
  .btn-yes.on{box-shadow:0 0 0 3px var(--mint-wash)}
  .btn-no.on{border-color:var(--pink); color:var(--pink); box-shadow:0 0 0 3px var(--pink-wash)}
  .status{margin-top:12px; font-size:14px; color:var(--secondary); min-height:20px}
  .status.ok{color:var(--mint)} .status.err{color:var(--pink)}
  .tools{display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; font-size:14px}
  .tools a{color:var(--lav); text-decoration:none; font-weight:600}
  .foot{margin-top:28px; text-align:center; font-size:13.5px; color:var(--secondary)}
  .foot a{color:var(--ink); font-weight:650; text-decoration:none}
  .foot a.cta{display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; text-decoration:none}
  .empty{padding:40px 10px; text-align:center; color:var(--secondary)}
  .skeleton{height:14px; border-radius:7px; background:var(--surface-2); margin:10px 0; animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  .lang{position:absolute; right:18px; top:24px; display:flex; gap:6px}
  .lang button{font:inherit; font-size:12px; font-weight:650; background:none; border:1px solid var(--hairline); color:var(--secondary); border-radius:999px; padding:4px 9px; cursor:pointer}
  .lang button.on{color:var(--ink); border-color:var(--ink)}
  @media (max-width:420px){ .lang{position:static; margin:-10px 0 16px} }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://getplan4u.com/">
    <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#7c5cfc"/><path d="M12 3C12.7 8 13.6 9.3 21 12C13.6 14.7 12.7 16 12 21C11.3 16 10.4 14.7 3 12C10.4 9.3 11.3 8 12 3Z" fill="white"/></svg>
    Plan4U
  </a>
  <div class="lang" id="lang"></div>

  <div class="card" id="card">
    <div id="loading">
      <div class="skeleton" style="width:40%"></div>
      <div class="skeleton" style="width:80%; height:26px"></div>
      <div class="skeleton" style="width:60%"></div>
      <div class="skeleton" style="width:50%"></div>
    </div>
  </div>

  <div class="foot">
    <div data-i18n="foot"></div>
    <a class="cta" href="https://apps.apple.com/us/app/plan4u/id6782844465">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.8 1.3 10.3.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.8-1.1-2.8-4.2zM14 5.3c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
      <span data-i18n="get"></span>
    </a>
  </div>
</div>

<script>
(function(){
  var API = "https://europe-west1-plan4u-64c47.cloudfunctions.net";
  var I18N = {
    en:{ inv:"Invitation", from:"From", when:"When", where:"Where", notes:"Notes", going:"Going", allday:"All day",
         you:"Your name", yes:"I'll be there", no:"Can't make it", sending:"Sending…", saved_yes:"Got it — see you there!", saved_no:"Got it — you've declined.",
         err:"Couldn't send your answer. Try again.", name_err:"Please enter your name.", notfound:"This link doesn't point to an event anymore.",
         add:"Add to calendar", repeat:"Repeats", foot:"Plan4U is a calendar for events, tasks and the people you plan them with.", get:"Get Plan4U",
         days:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] },
    ru:{ inv:"Приглашение", from:"От", when:"Когда", where:"Где", notes:"Описание", going:"Идут", allday:"Весь день",
         you:"Ваше имя", yes:"Я буду", no:"Не смогу", sending:"Отправляем…", saved_yes:"Отлично — до встречи!", saved_no:"Принято — вы отказались.",
         err:"Не удалось отправить ответ. Попробуйте ещё раз.", name_err:"Введите имя.", notfound:"По этой ссылке больше нет события.",
         add:"Добавить в календарь", repeat:"Повторяется", foot:"Plan4U — календарь для событий, задач и людей, с которыми вы их планируете.", get:"Скачать Plan4U",
         days:["Вс","Пн","Вт","Ср","Чт","Пт","Сб"] },
    uk:{ inv:"Запрошення", from:"Від", when:"Коли", where:"Де", notes:"Опис", going:"Прийдуть", allday:"Весь день",
         you:"Ваше ім’я", yes:"Я буду", no:"Не зможу", sending:"Надсилаємо…", saved_yes:"Чудово — до зустрічі!", saved_no:"Прийнято — ви відмовились.",
         err:"Не вдалося надіслати відповідь. Спробуйте ще раз.", name_err:"Введіть ім’я.", notfound:"За цим посиланням більше немає події.",
         add:"Додати в календар", repeat:"Повторюється", foot:"Plan4U — календар для подій, завдань і людей, з якими ви їх плануєте.", get:"Завантажити Plan4U",
         days:["Нд","Пн","Вт","Ср","Чт","Пт","Сб"] },
    es:{ inv:"Invitación", from:"De", when:"Cuándo", where:"Dónde", notes:"Notas", going:"Asisten", allday:"Todo el día",
         you:"Tu nombre", yes:"Allí estaré", no:"No podré", sending:"Enviando…", saved_yes:"¡Listo, nos vemos allí!", saved_no:"Listo — has rechazado.",
         err:"No se pudo enviar tu respuesta. Inténtalo de nuevo.", name_err:"Escribe tu nombre.", notfound:"Este enlace ya no apunta a un evento.",
         add:"Añadir al calendario", repeat:"Se repite", foot:"Plan4U es un calendario para eventos, tareas y las personas con las que los planeas.", get:"Descargar Plan4U",
         days:["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"] }
  };
  var LOCALE = { en:"en-GB", ru:"ru-RU", uk:"uk-UA", es:"es-ES" };
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var lang = (function(){
    var saved = null; try { saved = localStorage.getItem("plan4u.lang"); } catch(e){}
    if (saved && I18N[saved]) return saved;
    var nav = (navigator.language || "en").slice(0,2).toLowerCase();
    return I18N[nav] ? nav : "en";
  })();
  var guestId = null; try { guestId = localStorage.getItem("plan4u.guest." + token); } catch(e){}
  var data = null;

  function t(k){ return I18N[lang][k]; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtWhen(d){
    var opts = { weekday:"short", day:"numeric", month:"long" };
    var s = new Date(d.start), e = new Date(d.end);
    var loc = LOCALE[lang];
    if (d.isAllDay) {
      var sd = s.toLocaleDateString(loc, opts), ed = e.toLocaleDateString(loc, opts);
      return "<b>" + esc(sd === ed ? sd : sd + " – " + ed) + "</b><br>" + esc(t("allday"));
    }
    var tm = { hour:"2-digit", minute:"2-digit" };
    var sameDay = s.toDateString() === e.toDateString();
    var line1 = s.toLocaleDateString(loc, opts);
    var line2 = s.toLocaleTimeString(loc, tm) + (sameDay ? " – " + e.toLocaleTimeString(loc, tm)
                : " – " + e.toLocaleDateString(loc, opts) + ", " + e.toLocaleTimeString(loc, tm));
    return "<b>" + esc(line1) + "</b><br>" + esc(line2);
  }
  var ICON = {
    who:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    when:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    where:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h10l4 4v12H5z"/><path d="M8 12h8M8 16h8M15 4v4h4"/></svg>',
    going:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 20c0-2.6 1.6-4.5 4-4.5"/></svg>',
    repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>'
  };
  var COLORS = { mint:"#2fb56f", blue:"#4f8df7", lavender:"#7c5cfc", peach:"#ff8a4c", yellow:"#e0a400", pink:"#ff5a8a", graphite:"#6b6b73" };

  function repeatText(d){
    if (!d.repeatRaw || d.repeatRaw === "Never") return "";
    var n = d.repeatInterval || 1;
    var unit = { "Every day":["day","days"], "Every week":["week","weeks"], "Every month":["month","months"], "Every year":["year","years"] }[d.repeatRaw];
    if (!unit) return "";
    var words = {
      en:{ day:["every day","every %n days"], week:["every week","every %n weeks"], month:["every month","every %n months"], year:["every year","every %n years"] },
      ru:{ day:["каждый день","каждые %n дн."], week:["каждую неделю","каждые %n нед."], month:["каждый месяц","каждые %n мес."], year:["каждый год","каждые %n г."] },
      uk:{ day:["щодня","кожні %n дн."], week:["щотижня","кожні %n тиж."], month:["щомісяця","кожні %n міс."], year:["щороку","кожні %n р."] },
      es:{ day:["cada día","cada %n días"], week:["cada semana","cada %n semanas"], month:["cada mes","cada %n meses"], year:["cada año","cada %n años"] }
    }[lang][unit[0]];
    return n === 1 ? words[0] : words[1].replace("%n", n);
  }

  function render(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    var langBox = document.getElementById("lang");
    langBox.innerHTML = Object.keys(I18N).map(function(k){ return '<button data-lang="' + k + '" class="' + (k === lang ? "on" : "") + '">' + k.toUpperCase() + "</button>"; }).join("");
    langBox.querySelectorAll("button").forEach(function(b){ b.onclick = function(){ lang = b.getAttribute("data-lang"); try { localStorage.setItem("plan4u.lang", lang); } catch(e){} render(); }; });

    var card = document.getElementById("card");
    if (data === null) return;
    if (data === false) { card.innerHTML = '<div class="empty">' + esc(t("notfound")) + "</div>"; return; }
    var d = data;
    card.style.setProperty("--accent", COLORS[d.colorRaw] || COLORS.blue);
    var rows = "";
    rows += '<div class="row"><span class="ic">' + ICON.who + '</span><span class="v">' + esc(t("from")) + ": <b>@" + esc(d.ownerNickname || "plan4u") + "</b></span></div>";
    rows += '<div class="row"><span class="ic">' + ICON.when + '</span><span class="v">' + fmtWhen(d) + "</span></div>";
    var rep = repeatText(d);
    if (rep) rows += '<div class="row"><span class="ic">' + ICON.repeat + '</span><span class="v">' + esc(t("repeat")) + ": " + esc(rep) + "</span></div>";
    if (d.location) rows += '<div class="row"><span class="ic">' + ICON.where + '</span><span class="v"><a style="color:inherit" target="_blank" rel="noopener" href="https://maps.apple.com/?q=' + encodeURIComponent(d.location) + '">' + esc(d.location) + "</a></span></div>";
    if (d.notes) rows += '<div class="row"><span class="ic">' + ICON.notes + '</span><span class="v">' + esc(d.notes) + "</span></div>";
    if (d.going && d.going.length) rows += '<div class="row"><span class="ic">' + ICON.going + '</span><span class="v">' + esc(t("going")) + '<div class="going">' + d.going.map(function(n){ return '<span class="chip">' + esc(n) + "</span>"; }).join("") + "</div></span></div>";

    var answered = d.yourAnswer || "";
    var savedName = ""; try { savedName = localStorage.getItem("plan4u.name") || ""; } catch(e){}
    card.innerHTML =
      '<div class="kicker">' + esc(t("inv")) + "</div>" +
      "<h1>" + esc(d.title) + "</h1>" + rows +
      '<div class="answer"><label for="nm">' + esc(t("you")) + '</label><input id="nm" maxlength="40" autocomplete="name" value="' + esc(savedName) + '">' +
      '<div class="btns"><button class="btn btn-yes' + (answered === "accepted" ? " on" : "") + '" id="yes">' + esc(t("yes")) + "</button>" +
      '<button class="btn btn-no' + (answered === "declined" ? " on" : "") + '" id="no">' + esc(t("no")) + "</button></div>" +
      '<div class="status" id="st">' + (answered === "accepted" ? esc(t("saved_yes")) : answered === "declined" ? esc(t("saved_no")) : "") + "</div></div>" +
      '<div class="tools"><a href="' + API + "/eventByToken?t=" + encodeURIComponent(token) + '&ics=1">' + esc(t("add")) + "</a></div>";
    document.getElementById("yes").onclick = function(){ respond("accepted"); };
    document.getElementById("no").onclick = function(){ respond("declined"); };
  }

  function respond(status){
    var nm = document.getElementById("nm").value.trim();
    var st = document.getElementById("st");
    if (!nm) { st.className = "status err"; st.textContent = t("name_err"); document.getElementById("nm").focus(); return; }
    try { localStorage.setItem("plan4u.name", nm); } catch(e){}
    var yes = document.getElementById("yes"), no = document.getElementById("no");
    yes.disabled = no.disabled = true;
    st.className = "status"; st.textContent = t("sending");
    fetch(API + "/respondByToken", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ t: token, name: nm, status: status, g: guestId || undefined }) })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        guestId = j.g; try { localStorage.setItem("plan4u.guest." + token, guestId); } catch(e){}
        data.yourAnswer = status;
        yes.classList.toggle("on", status === "accepted"); no.classList.toggle("on", status === "declined");
        st.className = "status ok"; st.textContent = status === "accepted" ? t("saved_yes") : t("saved_no");
      })
      .catch(function(){ st.className = "status err"; st.textContent = t("err"); })
      .then(function(){ yes.disabled = no.disabled = false; });
  }

  render();
  if (!token) { data = false; render(); return; }
  fetch(API + "/eventByToken?t=" + encodeURIComponent(token) + (guestId ? "&g=" + encodeURIComponent(guestId) : ""))
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ data = j; document.title = j.title + " — Plan4U"; render(); })
    .catch(function(){ data = false; render(); });
})();
</script>
</body>
</html>
